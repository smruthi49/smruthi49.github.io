<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #notesList {
            list-style-type: none;
            padding: 0;
        }
        #notesList li {
            background-color: #f4f4f4;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #notesList li:hover {
            background-color: #e4e4e4;
        }
        #noteContent {
            margin-top: 20px;
        }
        .markdown-body {
            padding: 15px;
            background-color: #fff;
            border-radius: 5px;
        }
        #backToList {
            display: none;
            margin-bottom: 20px;
            cursor: pointer;
            color: #0366d6;
        }
        #errorMessage {
            color: red;
            text-align: center;
        }
        .loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>My Notes</h1>
    <div id="errorMessage"></div>
    <div id="backToList" onclick="showNotesList()">← Back to Notes List</div>
    <div id="loading" class="loading">Loading notes...</div>
    <ul id="notesList"></ul>
    <div id="noteContent"></div>

    <script>
        // IMPORTANT: Replace these with your GitHub details
        const GITHUB_USERNAME = 'smruthi49';
        const REPOSITORY_NAME = 'smruthi';
        const NOTES_FOLDER = 'notes/'; // Path to notes folder in your repository

        // Function to fetch list of Markdown files
        async function fetchMarkdownFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY_NAME}/contents/${NOTES_FOLDER}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const files = await response.json();
                
                // Defensive check and filtering
                const mdFiles = Array.isArray(files) 
                    ? files.filter(file => 
                        file && 
                        typeof file === 'object' && 
                        file.name && 
                        file.name.toLowerCase().endsWith('.md')
                    )
                    : [];

                return mdFiles;
            } catch (error) {
                console.error('Error fetching markdown files:', error);
                document.getElementById('errorMessage').textContent = `Error fetching notes: ${error.message}. Check console for details.`;
                return [];
            }
        }

        // Function to fetch content of a Markdown file
        async function fetchMarkdownContent(fileUrl) {
            try {
                const response = await fetch(fileUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return await response.text();
            } catch (error) {
                console.error('Error fetching markdown content:', error);
                return `Error loading note content: ${error.message}`;
            }
        }

        // Render list of notes
        async function renderNotesList() {
            const notesList = document.getElementById('notesList');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');

            // Clear previous content
            notesList.innerHTML = '';
            loading.style.display = 'block';
            errorMessage.textContent = '';

            try {
                const markdownFiles = await fetchMarkdownFiles();

                if (markdownFiles.length === 0) {
                    errorMessage.textContent = 'No markdown files found in the notes folder. Please check your configuration.';
                    loading.style.display = 'none';
                    return;
                }

                markdownFiles.forEach(file => {
                    const li = document.createElement('li');
                    // Remove .md extension and replace hyphens/underscores with spaces
                    li.textContent = file.name.replace(/\.(md|markdown)$/, '')
                        .replace(/[-_]/g, ' ');
                    li.onclick = () => loadNote(file.download_url);
                    notesList.appendChild(li);
                });

                loading.style.display = 'none';
            } catch (error) {
                loading.style.display = 'none';
                errorMessage.textContent = `Error: ${error.message}`;
            }
        }

        // Load and display a specific note
        async function loadNote(fileUrl) {
            const notesList = document.getElementById('notesList');
            const noteContent = document.getElementById('noteContent');
            const backToList = document.getElementById('backToList');

            // Hide notes list, show back button
            notesList.style.display = 'none';
            backToList.style.display = 'block';

            // Fetch and render markdown content
            const markdownText = await fetchMarkdownContent(fileUrl);
            noteContent.innerHTML = `
                <div class="markdown-body">
                    ${marked.parse(markdownText)}
                </div>
            `;
        }

        // Return to notes list
        function showNotesList() {
            const notesList = document.getElementById('notesList');
            const noteContent = document.getElementById('noteContent');
            const backToList = document.getElementById('backToList');

            // Show notes list, hide back button and content
            notesList.style.display = 'block';
            backToList.style.display = 'none';
            noteContent.innerHTML = '';
        }

        // Initialize page
        renderNotesList();
    </script>
</body>
</html>
