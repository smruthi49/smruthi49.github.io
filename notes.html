<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        #notesList {
            list-style-type: none;
            padding: 0;
        }
        #notesList li {
            background-color: #f4f4f4;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #notesList li:hover {
            background-color: #e4e4e4;
        }
        #noteContent {
            margin-top: 20px;
        }
        .markdown-body {
            padding: 15px;
            background-color: #fff;
            border-radius: 5px;
        }
        #backToList {
            display: none;
            margin-bottom: 20px;
            cursor: pointer;
            color: #0366d6;
        }
    </style>
</head>
<body>
    <h1>My Notes</h1>
    <div id="backToList" onclick="showNotesList()">← Back to Notes List</div>
    <ul id="notesList"></ul>
    <div id="noteContent"></div>

    <script>
        // Replace with your GitHub username and repository name
        const GITHUB_USERNAME = 'smruthi49';
        const REPOSITORY_NAME = 'smruthi';
        const NOTES_FOLDER = 'notes/'; // Adjust this to your notes folder path

        // Function to fetch list of Markdown files
        async function fetchMarkdownFiles() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY_NAME}/contents/${NOTES_FOLDER}`);
                const files = await response.json();
                return files.filter(file => file.name.endsWith('.md'));
            } catch (error) {
                console.error('Error fetching markdown files:', error);
                return [];
            }
        }

        // Function to fetch content of a Markdown file
        async function fetchMarkdownContent(path) {
            try {
                const response = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPOSITORY_NAME}/main/${path}`);
                return await response.text();
            } catch (error) {
                console.error('Error fetching markdown content:', error);
                return 'Error loading note content.';
            }
        }

        // Render list of notes
        async function renderNotesList() {
            const notesList = document.getElementById('notesList');
            const markdownFiles = await fetchMarkdownFiles();

            markdownFiles.forEach(file => {
                const li = document.createElement('li');
                // Remove .md extension and replace hyphens/underscores with spaces
                li.textContent = file.name.replace(/\.(md|markdown)$/, '')
                    .replace(/[-_]/g, ' ');
                li.onclick = () => loadNote(file.path);
                notesList.appendChild(li);
            });
        }

        // Load and display a specific note
        async function loadNote(path) {
            const notesList = document.getElementById('notesList');
            const noteContent = document.getElementById('noteContent');
            const backToList = document.getElementById('backToList');

            // Hide notes list, show back button
            notesList.style.display = 'none';
            backToList.style.display = 'block';

            // Fetch and render markdown content
            const markdownText = await fetchMarkdownContent(path);
            noteContent.innerHTML = `
                <div class="markdown-body">
                    ${marked.parse(markdownText)}
                </div>
            `;
        }

        // Return to notes list
        function showNotesList() {
            const notesList = document.getElementById('notesList');
            const noteContent = document.getElementById('noteContent');
            const backToList = document.getElementById('backToList');

            // Show notes list, hide back button and content
            notesList.style.display = 'block';
            backToList.style.display = 'none';
            noteContent.innerHTML = '';
        }

        // Initialize page
        renderNotesList();
    </script>
</body>
</html>
